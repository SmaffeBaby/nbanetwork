include:
  - path: ./supabase/docker-compose.yml
    env_file:
      - ./supabase/.env

services:
  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supa-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-7ec11643641092091119f11e1a1f4a8e}
    command: server --console-address ":9001" /data
    volumes:
      - minio-data:/data

  minio-createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -ec "
      until mc alias set supa-minio http://minio:9000 ${MINIO_ROOT_USER:-supa-storage} ${MINIO_ROOT_PASSWORD:-7ec11643641092091119f11e1a1f4a8e}; do sleep 1; done &&
      mc mb --ignore-existing supa-minio/${GLOBAL_S3_BUCKET:-stub}
      "

  storage:
    depends_on:
      minio:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-supa-storage}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-7ec11643641092091119f11e1a1f4a8e}

  frontend:
    build:
      context: .                       # корень проекта
      dockerfile: ./vite-project/Dockerfile
    ports:
      - "80:80"                        # доступ к SPA по http://localhost
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./vite-project/.env
      - ./supabase/.env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=http://kong:8000
      - VK_ACCESS_TOKEN=${VK_ACCESS_TOKEN:-}
      - VK_VIDEO_OWNER_ID=${VK_VIDEO_OWNER_ID:--202211208}
      - VK_VIDEO_PLAYLIST_ID=${VK_VIDEO_PLAYLIST_ID:-8}

  python-backend:
    build:
      context: ./python-backend        # папка с Python backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  minio-data:
